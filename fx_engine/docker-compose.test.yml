version: "3.9"

services:
  db_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fx_test
      POSTGRES_PASSWORD: fx_test_secret
      POSTGRES_DB: fx_test_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fx_test -d fx_test_db"]
      interval: 3s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data
